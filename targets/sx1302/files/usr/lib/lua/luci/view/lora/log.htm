<%+header%>

<div class="cbi-map">
    <h2><%:LoRa Gateway System Logs%></h2>
    <div class="cbi-map-descr"><%:Realtime diagnostic logs captured from the LoRa concentrator hardware and network server forwarder process.%></div>

    <div style="margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
        <div>
            <label style="cursor: pointer; font-size: 13px; margin-right: 15px;">
                <input type="checkbox" id="chk-log-autoscroll" checked="checked" /> <%:Auto-scroll%>
            </label>
            <label style="cursor: pointer; font-size: 13px;">
                <input type="checkbox" id="chk-log-autorefresh" checked="checked" /> <%:Auto-refresh (3s)%>
            </label>
        </div>
        <div>
            <button type="button" class="cbi-button cbi-button-apply" onclick="fetchLog()"><%:Refresh Now%></button>
            <button type="button" class="cbi-button" onclick="downloadLog()"><%:Download Log%></button>
        </div>
    </div>

    <pre id="syslog-content" style="background: #1e1e1e; color: #39ff14; font-family: Consolas, monospace; font-size: 12px; padding: 15px; border-radius: 6px; height: 500px; overflow-y: scroll; white-space: pre-wrap; word-break: break-all;"><%:Loading LoRa gateway logs...%></pre>
</div>

<script type="text/javascript">//<![CDATA[
function fetchLog() {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", '<%=luci.dispatcher.build_url("admin/lora/api_log")%>', true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
            var el = document.getElementById("syslog-content");
            el.innerText = xhr.responseText;
            if (document.getElementById("chk-log-autoscroll").checked) {
                el.scrollTop = el.scrollHeight;
            }
        }
    };
    xhr.send();
}

function downloadLog() {
    var text = document.getElementById("syslog-content").innerText;
    var blob = new Blob([text], {type: "text/plain"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "lora_gateway_" + new Date().toISOString().slice(0,10) + ".log";
    a.click();
}

window.onload = function() {
    fetchLog();
    setInterval(function() {
        if (document.getElementById("chk-log-autorefresh").checked) {
            fetchLog();
        }
    }, 3000);
};
//]]></script>

<%+footer%>
